server:
  port: 8080

spring:
  application:
    name: field-notes-backend
  datasource:
    url: jdbc:mysql://localhost:3306/field_notes_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: ""
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  jwt:
    secret: fieldNotesSecretKeyForJwtTokenGenerationAndValidation2026SecureKeyWith256BitsMinimumLength!
    expiration-ms: 86400000 # 24 hours
