server:
  port: 8081

spring:
  application:
    name: field-notes-backend-test
  datasource:
    url: jdbc:h2:mem:fieldnotes_testdb;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
    show-sql: false
  flyway:
    enabled: false

app:
  jwt:
    secret: test-only-signing-key-not-for-production-0000000000000000000000000
    expiration-ms: 86400000
