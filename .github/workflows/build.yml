name: Build and verify Field Notes
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: field_notes_db
          MYSQL_USER: field_notes
          MYSQL_PASSWORD: ci-disposable-password
          MYSQL_ROOT_PASSWORD: ci-disposable-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      DB_USERNAME: field_notes
      DB_PASSWORD: ci-disposable-password
      JWT_SECRET: ci-only-signing-secret-for-disposable-integration-server-000000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Backend build and tests
        run: mvn --batch-mode clean verify --file backend/pom.xml
      - name: Flutter dependencies, analysis and tests
        working-directory: mobile
        run: |
          flutter pub get
          flutter analyze
          flutter test
      - name: Start backend against MySQL
        run: |
          java -jar backend/target/field-notes-backend-1.0.0.jar > "$RUNNER_TEMP/backend.log" 2>&1 &
          for attempt in $(seq 1 60); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/api/customers)" = 401 ]; then
              exit 0
            fi
            sleep 2
          done
          cat "$RUNNER_TEMP/backend.log"
          exit 1
      - name: Live API verification
        run: python3 scripts/api_smoke.py
      - name: Offline, synchronization and reinstall recovery
        working-directory: mobile
        run: flutter test test/live_sync_verification.dart
      - name: Flutter release web build
        working-directory: mobile
        run: flutter build web
      - name: Android builds
        working-directory: mobile
        run: |
          flutter build apk --debug
          flutter build apk --release
